<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sev's AXCPT</title>
    <style>
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        #display-screen {
            font-size: 16rem;
            font-weight: bold;
            line-height: 1;
        }

        #results {
            text-align: center;
        }

        #results table {
            margin: 1rem auto;
            border-collapse: collapse;
        }

        #results th,
        #results td {
            padding: 0.5rem 1rem;
            border: 1px solid currentColor;
        }

        @media (max-width: 600px) {
            #display-screen {
                font-size: 10rem;
            }
        }
    </style>
</head>
<body>
    <div id="display-screen"></div>
    <section id="results" hidden>
        <h2>Spacebar Presses by Letter</h2>
        <table>
            <thead>
                <tr>
                    <th scope="col">Letter</th>
                    <th scope="col">Spacebar presses</th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </section>
    <script src="main.js"></script>
</body>
</html>
