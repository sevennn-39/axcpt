<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sev's AXCPT</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div id="display-screen"></div>
    <section id="results" hidden>
        <h2>Spacebar Presses by Letter</h2>

            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </section>
    <script src="main.js"></script>
</body>
</html>
